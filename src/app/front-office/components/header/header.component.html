<header class="navbar" id="navbar" #navbar>
  <div class="navbar-inner">
    <a routerLink="/" class="logo-wrapper" [class.scrolled]="isScrolled" #logoWrapper>
      @if (siteLogo) {
        <img [src]="siteLogo" [alt]="siteLogoAlt" class="header-logo">
      } @else {
        <span class="logo-main">LOÏC</span>
        <span class="logo-sub">Photography</span>
      }
    </a>

    <button class="hamburger" [class.active]="menuService.isOpen" (click)="toggleMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/gallery" routerLinkActive="active">Galerie</a>
      <a routerLink="/portfolio" routerLinkActive="active">Portfolio</a>
      <a href="#about" (click)="scrollTo('about')">About</a>
      <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
        <app-icon [name]="isDark ? 'light_mode' : 'dark_mode'" size="22"></app-icon>
      </button>
      <a routerLink="/admin" class="btn-nav">
        <app-icon name="admin_panel_settings" size="20"></app-icon>
        Admin
      </a>
    </nav>
  </div>
</header>

<section class="hero-gallery-hero" id="heroGalleryHome">
  <canvas class="hero-gallery-canvas" #heroGalleryCanvas></canvas>

  <div class="hero-gallery-overlay" id="heroGalleryOverlay"></div>

  <div class="hero-gallery-content" id="heroGalleryContent">
    <h1 class="hero-gallery-title">Galerie</h1>
    <p class="hero-gallery-subtitle">Une sélection de mes travaux photographiques</p>
  </div>

  <button class="hero-gallery-nav hero-gallery-nav-prev" (click)="prevSlide()" aria-label="Previous">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button class="hero-gallery-nav hero-gallery-nav-next" (click)="nextSlide()" aria-label="Next">
    <span class="material-symbols-outlined">chevron_right</span>
  </button>

  <div class="hero-gallery-dots" id="heroGalleryDots"></div>

  <div class="hero-gallery-thumbs" id="heroGalleryThumbs"></div>

  <div class="hero-gallery-scroll-indicator" id="heroGalleryScrollIndicator" #heroGalleryScrollIndicator>
    <span>Voir la galerie</span>
    <span class="material-symbols-outlined">keyboard_double_arrow_down</span>
  </div>
</section>

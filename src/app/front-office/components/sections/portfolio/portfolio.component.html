<section class="section" id="portfolio">
  <div class="container">
    <div class="rooms-title-row">
    <div>
      <div class="tag-line rv">Portfolio</div>
      <h2 class="big-serif rv d1">Captured <em>moments</em></h2>
    </div>
    <a class="btn-ghost rv" href="#">View all works</a>
  </div>

  @if (isLoading) {
    <div class="portfolio-loading">Chargement...</div>
  } @else {
    <div class="portfolio-grid">
      <div class="col-span-4">
        <div class="flex-col">
          @for (item of displayItems | slice:0:2; track item.id) {
            <div class="portfolio-item col-span-4">
              <div class="image" [style.backgroundImage]="'url(' + item.image + ')'"></div>
              <div class="overlay"></div>
              <span class="label">{{ item.label }}</span>
            </div>
          }
        </div>
      </div>

      @if (displayItems[2]) {
        <div class="portfolio-item col-span-4">
          <div class="image" [style.backgroundImage]="'url(' + displayItems[2].image + ')'"></div>
          <div class="overlay"></div>
          <span class="label">{{ displayItems[2].label }}</span>
        </div>
      }

      <div class="col-span-4">
        <div class="flex-col">
          @for (item of displayItems | slice:3:5; track item.id) {
            <div class="portfolio-item">
              <div class="image" [style.backgroundImage]="'url(' + item.image + ')'"></div>
              <div class="overlay"></div>
              <span class="label">{{ item.label }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  }

  <div style="text-align: center; margin-top: 48px;">
    <button class="btn-primary">
      View More
      <app-icon name="arrow_right_alt" size="20"></app-icon>
    </button>
  </div>
  </div>
</section>

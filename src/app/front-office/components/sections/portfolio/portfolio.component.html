<section class="section" id="portfolio">
  <div class="rooms-title-row">
    <div>
      <div class="tag-line rv">Portfolio</div>
      <h2 class="big-serif rv d1">Captured <em>moments</em></h2>
    </div>
    <a class="btn-ghost rv" href="#">View all works</a>
  </div>

  <div class="portfolio-grid">
    <div class="col-span-4">
      <div class="flex-col">
        <div class="portfolio-item col-span-4">
          <div class="image" [style.backgroundImage]="'url(' + portfolioItems[0].image + ')'"></div>
          <div class="overlay"></div>
          <span class="label">{{ portfolioItems[0].label }}</span>
        </div>
        <div class="portfolio-item col-span-4">
          <div class="image" [style.backgroundImage]="'url(' + portfolioItems[1].image + ')'"></div>
          <div class="overlay"></div>
          <span class="label">{{ portfolioItems[1].label }}</span>
        </div>
      </div>
    </div>

    <div class="portfolio-item col-span-4">
      <div class="image" [style.backgroundImage]="'url(' + portfolioItems[2].image + ')'"></div>
      <div class="overlay"></div>
      <span class="label">{{ portfolioItems[2].label }}</span>
    </div>

    <div class="col-span-4">
      <div class="flex-col">
        <div class="portfolio-item">
          <div class="image" [style.backgroundImage]="'url(' + portfolioItems[3].image + ')'"></div>
          <div class="overlay"></div>
          <span class="label">{{ portfolioItems[3].label }}</span>
        </div>
        <div class="portfolio-item">
          <div class="image" [style.backgroundImage]="'url(' + portfolioItems[4].image + ')'"></div>
          <div class="overlay"></div>
          <span class="label">{{ portfolioItems[4].label }}</span>
        </div>
      </div>
    </div>
  </div>

  <div style="text-align: center; margin-top: 48px;">
    <button class="btn-primary">
      View More
      <app-icon name="arrow_right_alt" size="20"></app-icon>
    </button>
  </div>
</section>

<section class="hero2-hero" id="hero2-home">
  <canvas class="hero2-canvas" #hero2Canvas></canvas>

  <div class="hero2-overlay" id="hero2-overlay"></div>

  <div class="hero2-content" id="hero2-content">
    <h1 class="hero2-title">LOÏC</h1>
    <p class="hero2-subtitle">"Immerse yourself in a visual journey where reality meets the imaginary."</p>
  </div>

  <button class="hero2-nav hero2-nav-prev" (click)="prevSlide()" aria-label="Previous">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button class="hero2-nav hero2-nav-next" (click)="nextSlide()" aria-label="Next">
    <span class="material-symbols-outlined">chevron_right</span>
  </button>

  <div class="hero2-dots" id="hero2-dots"></div>

  <div class="hero2-thumbs" id="hero2-thumbs"></div>

  <div class="scroll-indicator" id="hero2-scroll-indicator" #hero2ScrollIndicator>
    <span>Scroll Down</span>
    <span class="material-symbols-outlined">keyboard_double_arrow_down</span>
  </div>
</section>

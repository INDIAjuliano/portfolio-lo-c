<!-- LOADER -->
@if (showLoader) {
  <app-loader (dismissed)="onLoaderDismissed()" (ready)="onLoaderReady()"></app-loader>
}

<!-- MOBILE MENU OVERLAY -->
<div class="menu-overlay" [class.active]="menuService.isOpen" (click)="menuService.close()"></div>
<app-mobile-menu></app-mobile-menu>

<!-- HEADER -->
<app-header [class.loading]="showLoader"></app-header>

<!-- MAIN CONTENT -->
<main [class.loading]="showLoader">
  <router-outlet></router-outlet>
</main>

<!-- FOOTER -->
<app-footer [class.loading]="showLoader"></app-footer>

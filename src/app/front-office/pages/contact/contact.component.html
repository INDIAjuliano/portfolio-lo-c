<div class="section">
  <h1>Contact</h1>
  <p class="font-body-lg">Envoyez-moi un message, je vous répondrai dans les plus brefs délais.</p>

  @if (submitMessage) {
    <div class="contact-success">{{ submitMessage }}</div>
  }

  @if (submitError) {
    <div class="contact-error">{{ submitError }}</div>
  }

  <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Nom complet *</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          placeholder="Votre nom"
          required
          [disabled]="isSubmitting"
        />
      </div>
      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="votre@email.com"
          required
          [disabled]="isSubmitting"
        />
      </div>
    </div>
    <div class="form-group">
      <label for="phone">Téléphone</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        [(ngModel)]="phone"
        placeholder="+33 6 00 00 00 00"
        [disabled]="isSubmitting"
      />
    </div>
    <div class="form-group">
      <label for="message">Message *</label>
      <textarea
        id="message"
        name="message"
        [(ngModel)]="message"
        rows="5"
        placeholder="Votre message..."
        required
        [disabled]="isSubmitting"
      ></textarea>
    </div>
    <button type="submit" class="btn-primary" [disabled]="isSubmitting">
      @if (isSubmitting) {
        Envoi en cours...
      } @else {
        Envoyer le message
      }
    </button>
  </form>
</div>

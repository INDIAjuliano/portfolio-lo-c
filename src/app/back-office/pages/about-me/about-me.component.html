<div class="about-me-container">
  <div class="about-card">
    <h2>About Me</h2>
    @if (isLoading) {
      <p>Chargement...</p>
    } @else if (user) {
      <div class="about-avatar-section">
        <div class="about-avatar-preview">
          @if (user.avatar) {
            <img [src]="user.avatar" alt="Avatar" />
          } @else {
            <span class="material-symbols-outlined placeholder">person</span>
          }
        </div>
        <div class="about-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" [value]="user.firstName + ' ' + user.lastName" readonly />
          </div>
          <div class="form-group">
            <label>Role</label>
            <input type="text" value="Photographer" readonly />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" [value]="user.email" readonly />
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea rows="4" readonly>{{ user.bio || user.description || 'Professional photographer specializing in wedding, portrait, and corporate photography based in Paris.' }}</textarea>
          </div>
        </div>
      </div>
    } @else {
      <div class="about-avatar-section">
        <div class="about-avatar-preview">
          <span class="material-symbols-outlined placeholder">person</span>
        </div>
        <div class="about-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" value="Alexander G." readonly />
          </div>
          <div class="form-group">
            <label>Role</label>
            <input type="text" value="Photographer" readonly />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" value="alex@mampii.com" readonly />
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea rows="4" readonly>Professional photographer specializing in wedding, portrait, and corporate photography based in Paris.</textarea>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="about-stats">
    <div class="about-stat">
      <div class="stat-value">10+</div>
      <div class="stat-label">Years Experience</div>
    </div>
    <div class="about-stat">
      <div class="stat-value">500+</div>
      <div class="stat-label">Projects</div>
    </div>
    <div class="about-stat">
      <div class="stat-value">50+</div>
      <div class="stat-label">Clients</div>
    </div>
  </div>
</div>

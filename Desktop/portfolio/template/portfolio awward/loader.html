<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curtain Reveal - Image directe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* Image de fond - visible immédiatement */
        .background-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 1;
            /* Toujours visible */
            transform: scale(1.05);
            transition: transform 0.8s ease;
        }

        .background-image.zoomed {
            transform: scale(1);
        }

        /* Overlay sombre pour faire ressortir le rideau */
        .image-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: transparent;
            opacity: 1;
            transition: opacity 0s ease;
        }

        .image-overlay.fade {
            opacity: 0;
        }

        /* Panneaux du rideau (stores) */
        .curtain-container {
            position: absolute;
            inset: 0;
            display: flex;
            z-index: 10;
            pointer-events: none;
        }

        .curtain-panel {
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .curtain-panel-inner {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    #2a2a2a 0%,
                    #1a1a1a 25%,
                    #2a2a2a 50%,
                    #1a1a1a 75%,
                    #2a2a2a 100%);
            transform: scaleX(1);
            transform-origin: left center;
            will-change: transform;
        }

        .curtain-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Logo / texte (disparaît rapidement) */
        .brand-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            color: #fff;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            user-select: none;
        }

        .brand-overlay h1 {
            font-size: clamp(28px, 6vw, 64px);
            font-weight: 300;
            letter-spacing: clamp(8px, 2vw, 16px);
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.8);
        }

        .brand-overlay p {
            font-size: clamp(12px, 1.2vw, 16px);
            letter-spacing: 4px;
            opacity: 0.6;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.8);
        }

        /* Barre de progression - plus subtile */
        .progress-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(200px, 40vw);
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 2px;
            will-change: width;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .curtain-panel {
                border-right: 0.5px solid rgba(255, 255, 255, 0.03);
            }

            .progress-bar {
                bottom: 30px;
            }
        }

        @media (max-width: 480px) {
            .brand-overlay h1 {
                font-size: 24px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="scene" id="scene">

        <!-- Image de fond - visible immédiatement -->
        <img class="background-image" id="bgImage"
            src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600&q=80" alt="Paysage californien"
            loading="eager">

        <!-- Overlay sombre -->
        <div class="image-overlay" id="imageOverlay"></div>

        <!-- Rideau (stores) -->
        <div class="curtain-container" id="curtainContainer">
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
            <div class="curtain-panel">
                <div class="curtain-panel-inner"></div>
            </div>
        </div>

        <!-- Brand Overlay (disparaît vite) -->
        <div class="brand-overlay" id="brandOverlay">
            <h1>Loïc</h1>
            <p>Photography</p>
        </div>

        <!-- Barre de progression -->
        <div class="progress-bar" id="progressBar">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const panels = document.querySelectorAll('.curtain-panel');
            const bgImage = document.getElementById('bgImage');
            const imageOverlay = document.getElementById('imageOverlay');
            const brandOverlay = document.getElementById('brandOverlay');
            const progressFill = document.getElementById('progressFill');
            const progressBar = document.getElementById('progressBar');
            const curtainContainer = document.getElementById('curtainContainer');

            // L'image est déjà visible en arrière-plan
            // On lance l'animation du rideau immédiatement

            // --- Phase 1 : Apparition rapide du logo et barre ---
            const tl = gsap.timeline({
                defaults: { ease: 'power2.out' }
            });

            tl.to(brandOverlay, {
                duration: 0.5,
                opacity: 1,
                ease: 'power2.out'
            })
                .to(progressBar, {
                    duration: 0.4,
                    opacity: 1,
                    ease: 'power2.out'
                }, '-=0.2')
                .to(progressFill, {
                    duration: 1.8,
                    width: '100%',
                    ease: 'power2.inOut'
                });

            // --- Phase 2 : Ouverture des stores (immédiate) ---
            panels.forEach((panel, index) => {
                const inner = panel.querySelector('.curtain-panel-inner');
                // Décalage pour effet de vague
                const delay = 1.8 + (index * 0.03);

                // Le panneau se rétrécit horizontalement
                gsap.to(inner, {
                    duration: 1.0,
                    scaleX: 0,
                    ease: 'power3.inOut',
                    delay: delay,
                    transformOrigin: 'left center'
                });

                // Disparition du panneau
                const isCenter = index > 3 && index < 8;
                const centerDelay = isCenter ? 0.05 : 0;

                gsap.to(panel, {
                    duration: 0.6,
                    opacity: 0,
                    ease: 'power2.out',
                    delay: delay + 0.3 + centerDelay,
                    onComplete: () => {
                        if (index === panels.length - 1) {
                            // L'image est déjà visible, on enlève juste le rideau
                            gsap.to(curtainContainer, {
                                duration: 0.3,
                                opacity: 0,
                                ease: 'power2.out',
                                onComplete: () => {
                                    curtainContainer.style.display = 'none';
                                }
                            });

                            // L'overlay s'estompe doucement
                            gsap.to(imageOverlay, {
                                duration: 0.8,
                                opacity: 0,
                                ease: 'power2.out',
                                delay: 0.2
                            });

                            // Le logo disparaît
                            gsap.to(brandOverlay, {
                                duration: 0.4,
                                opacity: 0,
                                ease: 'power2.out',
                                delay: 0.1
                            });
                            gsap.to(progressBar, {
                                duration: 0.3,
                                opacity: 0,
                                ease: 'power2.out'
                            });

                            // Zoom subtil de l'image
                            bgImage.classList.add('zoomed');
                        }
                    }
                });
            });

            // --- Animation de l'image (zoom lent) ---
            gsap.to(bgImage, {
                duration: 12,
                scale: 1.08,
                ease: 'power1.inOut',
                delay: 3
            });

            // --- Effet de lumière sur les stores ---
            panels.forEach((panel, i) => {
                gsap.to(panel, {
                    duration: 2 + (i * 0.06),
                    opacity: 0.92 + (i % 2) * 0.06,
                    repeat: -1,
                    yoyo: true,
                    ease: 'sine.inOut',
                    delay: i * 0.03
                });
            });

            // --- Gestion du redimensionnement ---
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    // Ajuster l'image si besoin
                }, 100);
            });

        });
    </script>

</body>

</html>

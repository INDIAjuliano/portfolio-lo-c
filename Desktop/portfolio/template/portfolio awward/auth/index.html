<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mampii Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <style>
        /* ============================================================ */
        /* RESET & BASE */
        /* ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --accent-color: #6c5ce7;
            --accent-hover: #5a4bd1;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #1a1a2e;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0b0;
            --text-muted: #6b7280;
            --border-color: #2a2a3e;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            padding: 20px;
        }

        /* ============================================================ */
        /* LOGIN CONTAINER */
        /* ============================================================ */
        .login-container {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================ */
        /* LOGIN CARD */
        /* ============================================================ */
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px 36px 36px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 40px var(--shadow-color);
            transition: var(--transition);
        }

        /* ============================================================ */
        /* BRAND */
        /* ============================================================ */
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-brand .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--accent-color);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
        }

        .login-brand h1 {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .login-brand h1 span {
            color: var(--accent-color);
        }

        .login-brand p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ============================================================ */
        /* THEME TOGGLE */
        /* ============================================================ */
        .theme-toggle-wrap {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .theme-toggle .material-symbols-outlined {
            font-size: 20px;
        }

        /* ============================================================ */
        /* FORM */
        /* ============================================================ */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .form-group .input-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.08);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 0 0 14px;
            color: var(--text-muted);
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        .form-group .input-wrapper input {
            border: none;
            background: transparent;
            padding: 12px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            width: 100%;
            outline: none;
        }

        .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .form-group .input-wrapper .toggle-password {
            padding: 0 14px 0 0;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            transition: var(--transition);
            background: none;
            border: none;
            display: flex;
            align-items: center;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: var(--text-primary);
        }

        /* ============================================================ */
        /* OPTIONS */
        /* ============================================================ */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .login-options .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .login-options .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .login-options .forgot-link {
            font-size: 13px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-options .forgot-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* ============================================================ */
        /* BUTTONS */
        /* ============================================================ */
        .btn-login {
            width: 100%;
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(108, 92, 231, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login .material-symbols-outlined {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .btn-login:hover .material-symbols-outlined {
            transform: translateX(4px);
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-login.loading .material-symbols-outlined {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================ */
        /* SEPARATOR */
        /* ============================================================ */
        .login-separator {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .login-separator .line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .login-separator .text {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ============================================================ */
        /* SOCIAL LOGIN */
        /* ============================================================ */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-login .btn-social {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-login .btn-social:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
            background: var(--bg-secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .social-login .btn-social .social-icon {
            font-size: 18px;
        }

        /* ============================================================ */
        /* FOOTER */
        /* ============================================================ */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* ============================================================ */
        /* TOAST */
        /* ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 22px;
            box-shadow: 0 8px 40px var(--shadow-color);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 300;
            transform: translateY(80px);
            opacity: 0;
            transition: var(--transition);
            max-width: 380px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast .toast-icon {
            font-size: 22px;
        }

        .toast .toast-icon.success {
            color: var(--success);
        }

        .toast .toast-icon.error {
            color: var(--danger);
        }

        .toast .toast-message {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: var(--transition);
        }

        .toast .toast-close:hover {
            color: var(--text-primary);
        }

        /* ============================================================ */
        /* RESPONSIVE */
        /* ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
            }

            .login-brand h1 {
                font-size: 20px;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
            }

            .social-login {
                flex-direction: column;
            }

            .theme-toggle-wrap {
                top: 12px;
                right: 12px;
            }

            .theme-toggle span:last-child {
                display: none;
            }
        }

        /* ============================================================ */
        /* BACKGROUND DECORATION */
        /* ============================================================ */
        .bg-decoration {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-decoration .circle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-color);
            opacity: 0.03;
        }

        .bg-decoration .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
        }

        .bg-decoration .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
        }

        [data-theme="dark"] .bg-decoration .circle {
            opacity: 0.05;
        }
    </style>
</head>

<body>

    <!-- ============================================================ -->
    <!-- BACKGROUND DECORATION -->
    <!-- ============================================================ -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- ============================================================ -->
    <!-- THEME TOGGLE -->
    <!-- ============================================================ -->
    <div class="theme-toggle-wrap">
        <button class="theme-toggle" id="themeToggle">
            <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
            <span id="themeLabel">Sombre</span>
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- LOGIN CONTAINER -->
    <!-- ============================================================ -->
    <div class="login-container">

        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="logo-icon">P</div>
                <h1>Puzzle<span>.</span></h1>
                <p>Administration Dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="email">
                        Email
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon material-symbols-outlined">mail</span>
                        <input type="email" id="email" placeholder="admin@mampii.com" value="admin@mampii.com" required
                            autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        Mot de passe
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon material-symbols-outlined">lock</span>
                        <input type="password" id="password" placeholder="••••••••" value="password123" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        Se souvenir de moi
                    </label>
                    <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="material-symbols-outlined">login</span>
                    Se connecter
                </button>
            </form>

            <!-- Separator -->
            <div class="login-separator">
                <span class="line"></span>
                <span class="text">ou continuez avec</span>
                <span class="line"></span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="btn-social" data-provider="google">
                    <span class="social-icon">G</span>
                    Google
                </button>
                <button class="btn-social" data-provider="github">
                    <span class="social-icon">🐙</span>
                    GitHub
                </button>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                Pas encore de compte ? <a href="#">Créer un compte</a>
            </div>

        </div>

    </div>

    <!-- ============================================================ -->
    <!-- TOAST -->
    <!-- ============================================================ -->
    <div class="toast" id="toast">
        <span class="toast-icon success material-symbols-outlined">check_circle</span>
        <span class="toast-message" id="toastMessage">Succès !</span>
        <button class="toast-close" id="toastClose">✕</button>
    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ============================================================
            // RÉFÉRENCES DOM
            // ============================================================
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const togglePassword = document.getElementById('togglePassword');
            const rememberMe = document.getElementById('rememberMe');

            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');

            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastClose = document.getElementById('toastClose');

            // ============================================================
            // THÈME
            // ============================================================
            let isDark = localStorage.getItem('loginTheme') === 'dark';

            function setTheme(dark) {
                isDark = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                themeIcon.textContent = dark ? 'light_mode' : 'dark_mode';
                themeLabel.textContent = dark ? 'Clair' : 'Sombre';
                localStorage.setItem('loginTheme', dark ? 'dark' : 'light');
            }

            setTheme(isDark);

            themeToggle.addEventListener('click', () => {
                setTheme(!isDark);
            });

            // ============================================================
            // TOGGLE PASSWORD VISIBILITY
            // ============================================================
            let passwordVisible = false;

            togglePassword.addEventListener('click', () => {
                passwordVisible = !passwordVisible;
                passwordInput.type = passwordVisible ? 'text' : 'password';
                togglePassword.querySelector('.material-symbols-outlined').textContent =
                    passwordVisible ? 'visibility_off' : 'visibility';
            });

            // ============================================================
            // TOAST
            // ============================================================
            let toastTimeout;

            function showToast(message, type = 'success') {
                toastMessage.textContent = message;
                const icon = toast.querySelector('.toast-icon');
                icon.textContent = type === 'success' ? 'check_circle' : 'error';
                icon.className = `toast-icon material-symbols-outlined ${type}`;
                toast.classList.add('show');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
            }

            toastClose.addEventListener('click', () => {
                toast.classList.remove('show');
                clearTimeout(toastTimeout);
            });

            // ============================================================
            // LOGIN
            // ============================================================
            // Utilisateurs de test
            const users = [
                { email: 'admin@mampii.com', password: 'password123', name: 'Administrateur' },
                { email: 'alex@mampii.com', password: 'alex2024', name: 'Alexander G.' },
                { email: 'test@test.com', password: 'test123', name: 'Utilisateur Test' }
            ];

            function handleLogin(email, password) {
                // Simuler une requête API
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const user = users.find(u =>
                            u.email.toLowerCase() === email.toLowerCase() &&
                            u.password === password
                        );

                        if (user) {
                            resolve(user);
                        } else {
                            reject(new Error('Email ou mot de passe incorrect'));
                        }
                    }, 1200);
                });
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Validation basique
                if (!email || !password) {
                    showToast('Veuillez remplir tous les champs', 'error');
                    return;
                }

                if (!email.includes('@')) {
                    showToast('Veuillez entrer un email valide', 'error');
                    return;
                }

                // État de chargement
                loginBtn.classList.add('loading');
                loginBtn.innerHTML = `
                    <span class="material-symbols-outlined">refresh</span>
                    Connexion...
                `;

                try {
                    const user = await handleLogin(email, password);

                    // Sauvegarder la session
                    if (rememberMe.checked) {
                        localStorage.setItem('user', JSON.stringify(user));
                        localStorage.setItem('isLoggedIn', 'true');
                    } else {
                        sessionStorage.setItem('user', JSON.stringify(user));
                        sessionStorage.setItem('isLoggedIn', 'true');
                    }

                    showToast(`✅ Bienvenue ${user.name} ! Redirection...`, 'success');

                    // Redirection vers le dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);

                } catch (error) {
                    showToast('❌ ' + error.message, 'error');

                    // Réinitialiser le bouton
                    loginBtn.classList.remove('loading');
                    loginBtn.innerHTML = `
                        <span class="material-symbols-outlined">login</span>
                        Se connecter
                    `;

                    // Animation de shake
                    loginForm.style.animation = 'shake 0.5s ease';
                    setTimeout(() => {
                        loginForm.style.animation = '';
                    }, 500);
                }
            });

            // ============================================================
            // SOCIAL LOGIN
            // ============================================================
            document.querySelectorAll('.btn-social').forEach(btn => {
                btn.addEventListener('click', () => {
                    const provider = btn.dataset.provider;
                    showToast(`🔗 Connexion avec ${provider} (démo)`, 'success');

                    // Simuler une connexion sociale
                    setTimeout(() => {
                        const demoUser = { email: `${provider}@mampii.com`, name: `Utilisateur ${provider}` };
                        localStorage.setItem('user', JSON.stringify(demoUser));
                        localStorage.setItem('isLoggedIn', 'true');
                        showToast(`✅ Connecté avec ${provider} !`, 'success');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1200);
                    }, 1000);
                });
            });

            // ============================================================
            // FORGOT PASSWORD
            // ============================================================
            document.querySelector('.forgot-link').addEventListener('click', (e) => {
                e.preventDefault();
                showToast('📧 Un lien de réinitialisation va vous être envoyé', 'success');
            });

            // ============================================================
            // ENTER KEY
            // ============================================================
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            // ============================================================
            // VÉRIFIER SI DÉJÀ CONNECTÉ
            // ============================================================
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true' ||
                sessionStorage.getItem('isLoggedIn') === 'true';

            if (isLoggedIn) {
                // Rediriger vers le dashboard si déjà connecté
                // Décommenter pour activer la redirection automatique
                // window.location.href = 'dashboard.html';
            }

            // ============================================================
            // SHIMMER EFFECT
            // ============================================================
            // Ajouter un peu de vie avec une animation d'entrée
            document.querySelector('.login-container').style.animation = 'slideUp 0.6s ease';

            console.log('🔐 Puzzle Admin Login');
            console.log('📧 Comptes de test:');
            console.log('  admin@mampii.com / password123');
            console.log('  alex@mampii.com / alex2024');
            console.log('  test@test.com / test123');

        });
    </script>

</body>

</html>
